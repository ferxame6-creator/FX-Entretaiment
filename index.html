<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FX-Entretaiment-Dance</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="extras.css"></head><body><main class="app"><header><b>✦ FX-ENTRETAIMENT <small>DANCE</small></b><input id="projectName" value="Mi coreografía"><button id="settings">⚙</button></header><section class="toolbar"><button id="undo">↶</button><button id="redo">↷</button><button id="addDancer">＋ Bailarín</button><button id="deleteDancer">⌫ Eliminar</button><button id="color">● Color</button><button id="copy">Copiar</button><button id="paste">Pegar</button></section><section class="workspace"><aside class="panel"><p>FORMACIONES</p><div id="formations"></div><button id="newFormation">＋ Nueva formación</button><div class="formActions"><button id="renameFormation">Renombrar</button><button id="duplicateFormation">Duplicar</button><button id="removeFormation">Eliminar</button></div></aside><section class="center"><div class="stageTop"><b>BACKSTAGE</b><span><button id="zoomOut">−</button><i id="zoomLabel">100%</i><button id="zoomIn">＋</button><button id="togglePaths">⌁</button></span></div><div id="viewport"><div id="stage"><i class="midline"></i><i class="cross"></i><i class="center-mark"></i></div></div><div class="audience">AUDIENCIA</div><div class="transform"><button data-action="rotate">↻ Rotar</button><button data-action="mirrorH">↔ Espejar H</button><button data-action="mirrorV">↕ Espejar V</button><button data-action="center">⊙ Centrar</button><button data-action="swap">⇄ Intercambiar</button></div><div id="distanceInfo" class="distance-info">Distancia: --</div></section><aside class="panel controls"><p>TRANSICIÓN</p><div class="next"><small>SIGUIENTE FORMACIÓN</small><strong id="nextName"></strong><div id="preview"></div></div><label>Velocidad<select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><label>Duración <output id="durationValue">4 s</output><input id="duration" type="range" min="1" max="15" value="4"></label><label>Retraso por bailarín <output id="delayValue">0 ms</output><input id="delay" type="range" min="0" max="800" step="100" value="0"></label><button class="play" id="play">▶ Reproducir transición</button><button class="play" id="advanceButton">→ Avanzar</button><label class="check"><input id="snapGrid" type="checkbox"> Ajustar a cuadrícula</label><label class="check"><input id="sequenceSteps" type="checkbox"> Secuencia de pasos</label><label>BPM <output id="bpmValue">120</output><input id="bpm" type="range" min="60" max="200" value="120"></label><label class="check"><input id="paths" type="checkbox"> Mostrar líneas de recorrido</label><p>MÚSICA Y TIEMPOS</p><div class="music"><button id="musicPlay">▶</button><span id="musicTime">0:00</span><input id="musicProgress" type="range" min="0" max="100" value="0"><span>2:48</span></div><div class="timer"><b id="beat">1</b><span>TIEMPO</span><em id="timer">00:00</em></div><div id="status">Guardado automático activado</div></aside></section></main><div id="modal" class="modal hidden"><div><button class="close">×</button><h2>Ajustes</h2><label>Tamaño de escenario<select id="stageSize"><option value="520">Mediano</option><option value="640">Grande</option><option value="420">Pequeño</option></select></label><label><input id="lightMode" type="checkbox"> Tema claro</label></div></div><script src="app_stable.js"></script><script src="extras.js"></script></body></html>
